# Rebuilds the review badge PNGs once a day and publishes them to GitHub Pages.
# Actions are pinned to commit SHAs (supply-chain policy); the tag is noted beside each.
name: Build review badges

on:
  schedule:
    - cron: "17 3 * * *"        # daily 03:17 UTC
  workflow_dispatch:            # "Run workflow" button for manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0

      - run: pip install -r requirements.txt

      - run: python generate.py
        env:
          BADGE_PUBLISHED_BASE: ${{ steps.pages.outputs.base_url }}
          BADGE_STORES: "us"            # add au,ca,eu once their /pages/review-count exists

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346       # v5.0.1
